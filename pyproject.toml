[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffdocket"
version = "0.1.0"
description = "Generate deterministic maintainer review receipts for pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LarryBuildsAI" }]
keywords = ["github", "pull-request", "maintainer", "review", "release"]

[project.scripts]
diffdocket = "pr_review_receipt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "index.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
