name: DiffDocket
description: Generate a deterministic maintainer review packet for a pull request.
inputs:
  repo-path:
    description: Path to the git repository.
    required: false
    default: .
  base:
    description: Base ref to compare against.
    required: false
    default: origin/main
  head:
    description: Head ref to compare against.
    required: false
    default: HEAD
  output:
    description: Optional output path for the rendered receipt.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Generate receipt
      shell: bash
      run: |
        diffdocket --repo "${{ inputs.repo-path }}" --base "${{ inputs.base }}" --head "${{ inputs.head }}" --output "${{ inputs.output }}"
